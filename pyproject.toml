[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "archivist-mcp"
dynamic = ["version"]
description = "Single-file local and fleet memory server for AI coding agents via MCP"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
keywords = ["mcp", "memory", "agents", "sqlite-vec", "onnx", "retrieval"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "mcp>=1.28.1,<2.0.0",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "pydantic-settings>=2.14.2",
    "aiosqlite>=0.20.0",
    "starlette>=1.3.1",
    "uvicorn>=0.51.0",
    "watchfiles>=1.0.0",
    "tqdm>=4.66.0",
    "google-re2>=1.1",
    "sqlite-vec>=0.1.6",
    "numpy>=1.26.0",
]

[project.scripts]
archivist = "archivist.cli.main:main"
archivist-mcp = "archivist.cli.main:mcp_entrypoint"

[project.optional-dependencies]
local = [
    "sqlite-vec>=0.1.6",
    "onnxruntime>=1.19.0",
    "tokenizers>=0.20.0",
    "google-re2>=1.1",
    "numpy>=1.26.0",
]
usearch = [
    "usearch>=2.16.0",
]
postgres = [
    "asyncpg>=0.30.0",
    "pgvector>=0.3.6",
]
qdrant = [
    "qdrant-client>=1.13.0,<2.0.0",
]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.4.0",
    "pytest-cov>=6.0.0",
    "mypy==1.19.1",
    "ruff>=0.9.0",
    "bandit>=1.8.0",
    "tiktoken>=0.7.0",
    "build>=1.2.0",
]

[tool.hatch.version]
path = "src/archivist/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/archivist"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/archivist",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
    # Speed / tier markers
    "unit: pure logic tests, no I/O (fastest — run on every save)",
    "integration: real SQLite + mocked external services",
    "system: full MCP handler coverage across all tools",
    "chaos: fault injection, adversarial, concurrent stress tests",
    "performance: timing regression assertions — run isolated",
    "regression: specific bug regression guards",
    # Domain markers
    "storage: tests touching SQLite, Qdrant, outbox, or backup",
    "lifecycle: tests for delete/archive/merge/cascade paths",
    "retrieval: tests for search, ranking, graph retrieval, synthesis",
    "mcp: tests for MCP tool handlers and transport layer",
    "rbac: tests for namespace access control",
    # Utility markers
    "slow: tests taking more than 2 seconds (deselect during development)",
    "benchmark: performance benchmarks (run with 'pytest benchmarks/')",
    # Coach-core reliability (INIT-003/SPEC-008)
    "coach_core: coach-path CI evals (store/index/search/get_context, ack SLO, namespace isolation)",
    # Agentic memory eval gym (INIT-006/SPEC-002) — sibling to coach_core; Memory→Action
    "agentic_memory: multi-session Memory→Action CI evals (omit-store / poisoned-memory; ADR-006)",
    # Continual Recursive Self-Improvement + Self-Improvement Memory (INIT-001/SPEC-001)
    "crsi: CRSI harness loop & SIM tests (deterministic, no paid APIs)",
]
addopts = ["--strict-markers", "--tb=short", "-q"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "T20", # flake8-print (no bare print in library code)
    "RUF", # Ruff-specific rules
    "SIM", # flake8-simplify
    "PIE", # flake8-pie
    "Q",   # flake8-quotes
]
ignore = [
    # Existing codebase baseline — tighten these over time
    "E501",   # line too long — formatter handles most; rest needs per-file review
    "E402",   # module-level import not at top — intentional mid-file imports in some modules
    "S101",   # assert used — fine in tests
    "S110",   # try-except-pass — legacy error-swallowing; tracked separately
    "S112",   # try-except-continue — same
    "S324",   # insecure hash (MD5/SHA1) — used for non-security checksums
    "S608",   # hardcoded SQL expressions — parameterised elsewhere, FTS5 OK
    "S104",   # hardcoded bind-all — intentional MCP server behaviour
    "S603",   # subprocess without shell=True — not a risk in our context
    "T201",   # print — allowed in CLI / benchmark entry points
    "B007",   # unused loop variable — common in retry/backoff loops
    "B905",   # zip without strict — intentional in zip-shortest uses
    "C408",   # unnecessary dict/list/tuple call — minor style
    "RUF001", # ambiguous Unicode string — doc strings are intentional
    "RUF002", # ambiguous Unicode docstring — same
    "RUF003", # ambiguous Unicode comment — same
    "RUF005", # collection literal concat — intentional in some list builds
    "RUF059", # unused unpacked variable — used for side-effect unpacking
    "SIM102", # collapsible-if — readability preference
    "SIM105", # suppressible-exception — contextlib.suppress refactor deferred
    "SIM108", # ternary refactor — readability preference
    "SIM117", # multiple-with — readability preference
    "SIM118", # in-dict-keys — minor
    "UP042",  # str-enum — requires Python 3.11+ min; deferred
    "UP047",  # non-pep695-generic — requires Python 3.12 syntax; deferred
    "E741",   # ambiguous variable name — isolated; review manually
    "C401",   # unnecessary generator → set() — minor
    "RUF012", # mutable class vars — dataclass fields
    # INIT-001/SPEC-005: S607 (partial executable path), SIM103
    # (return-negated-condition), and B008 (function calls in defaults) were
    # removed — 0 current violations across src/ and tests/, confirmed via
    # `ruff check --select <code>`. Re-add with a justification comment if a
    # future change legitimately needs one of them.
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106", "T201", "S105", "S108"]
"benchmarks/**" = [
    "T201",
    "S101",
    "S108",
    "S311", # non-cryptographic RNG (bootstrap resampling for benchmark stats), not security-relevant
]
"src/archivist/app/main.py" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["archivist"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
# Matches the minimum Python CI/Dockerfile target (3.12). Pinning this below the
# interpreter's actual floor made mypy abort after ~3 errors (numpy's bundled
# .pyi stubs use PEP 695 `type` statements that need 3.12+ syntax support),
# which silently reduced the "ratchet" to a near no-op. INIT-001/SPEC-005.
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true

# Suppress errors for third-party packages with no stubs
[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

# Optional reranker deps — only installed with requirements-rerank.txt
[[tool.mypy.overrides]]
module = ["sentence_transformers", "sentence_transformers.*"]
ignore_missing_imports = true

# MCP / Starlette / uvicorn — present at runtime, stubs vary by version
[[tool.mypy.overrides]]
module = ["mcp", "mcp.*", "starlette", "starlette.*", "uvicorn", "uvicorn.*", "watchfiles", "watchfiles.*"]
ignore_missing_imports = true

# Qdrant client — has stubs but version drift can cause issues
[[tool.mypy.overrides]]
module = ["qdrant_client", "qdrant_client.*"]
ignore_missing_imports = true

# asyncpg — optional dependency (only needed for GRAPH_BACKEND=postgres)
[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[tool.bandit]
# B608: all SQL in this codebase uses ? placeholders — Bandit cannot detect
# that the f-string builds only the IN (...) placeholder list, not user data.
# Every flagged site has been manually verified as parameterised.
# B104: 0.0.0.0 bind is intentional for the MCP server container entrypoint.
skips = ["B608", "B104"]

[tool.coverage.run]
branch = true
source = ["src/archivist"]
omit = ["tests/*", "benchmarks/*", "src/*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
fail_under = 49  # measured 53.3% (2026-07-25, unit+regression+integration+system);
                  # step +3 from prior 46 floor (baseline 51.4%, 2026-04-17) — INIT-001/SPEC-005.
                  # Raise by 2-5 pts each quarter as coverage grows.

[tool.pytest-benchmark]
disable_gc = true
warmup = true
min_rounds = 5
