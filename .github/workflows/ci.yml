# ─────────────────────────────────────────────────────────────────────────────
# Archivist CI
#
# Jobs (parallel unless noted):
#   pre-commit    → enforce local hooks — catches --no-verify bypasses
#   lint          → Ruff format + lint (S110/S112 enabled)
#   typecheck     → mypy error-count ratchet (≤ 55 repo-wide, 0 on PR-changed files)
#   test          → unit + regression (3.12 + 3.13) + AST GR-LAYER-001 guard
#   integration   → integration + system on SQLite + live pgvector/pgvector:pg17 (0 skipped PG)
#   coverage-gate → combined coverage ≥ 65% + PR diff-cover ≥ 80% (needs test + integration)
#   package-smoke → 3-OS (ubuntu/macos/windows) wheel / CLI smoke
#   chaos         → fault injection / adversarial (PRs to main)
#   performance   → timing + >50ms asyncio stall watchdog gates (main pushes)
#   security      → pip-audit (CVE) + Bandit (SAST) + Trivy (filesystem)
#   docker        → build + real non-masked /health, /metrics, and /mcp smoke test
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main, master, "feature/**", "fix/**"]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# ─── Pre-commit ───────────────────────────────────────────────────────────────
jobs:
  pre-commit:
    name: Pre-commit Hooks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: pre-commit/action@v3.0.1

# ─── Lint ────────────────────────────────────────────────────────────────────
  lint:
    name: Lint & Format (Ruff)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Ruff
        run: uv tool install ruff

      - name: Ruff format check
        run: ruff format --check src/ tests/

      - name: Ruff lint
        run: ruff check src/ tests/

# ─── Type check (ratchet — error count may only decrease) ────────────────────
  typecheck:
    name: Type Check (mypy ratchet ≤ 55 errors, 0 on PR files)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          pip install --upgrade pip
          # Pin mypy to match local baseline (INIT-002/SPEC-005). Unpinned installs
          # pulled 2.3.0 and broke the ratchet with version skew vs developers on 1.19.1.
          pip install -r requirements.txt "mypy==1.19.1" types-PyYAML types-tqdm

      - name: mypy — ratchet gate + zero-error PR-changed files gate
        # Only real type errors count — import-not-found / import-untyped are
        # excluded because they vary by environment.
        # Ratchet history:
        #   170 (baseline) → 120 (PR #72) → 64 (Wave 1 PR #73) → 53 (Wave 3A INIT-025).
        # Ceiling tightened from 175 → 55 (INIT-025/SPEC-012).
        env:
          MYPY_MAX_ERRORS: "55"
        run: |
          # mypy exits 1 when any errors exist — capture under `|| true` so
          # `bash -e` does not abort before the ratchet count (INIT-002).
          OUTPUT=$(python -m mypy src/archivist/ --config-file pyproject.toml 2>&1) || true
          echo "$OUTPUT"
          REAL_ERRORS=$(echo "$OUTPUT" | grep "^src/archivist/.*: error:" | grep -v "\[import-not-found\]\|\[import-untyped\]" || true)
          if [ -z "$REAL_ERRORS" ]; then
            COUNT=0
          else
            COUNT=$(echo "$REAL_ERRORS" | wc -l | tr -d ' ')
          fi
          echo ""
          echo "::notice::mypy type errors (real, excl. import stubs): $COUNT / ceiling: $MYPY_MAX_ERRORS"
          if [ "${COUNT:-0}" -gt "$MYPY_MAX_ERRORS" ]; then
            echo "::error::mypy error count ($COUNT) exceeds ratchet ceiling ($MYPY_MAX_ERRORS). Fix errors before merging."
            exit 1
          fi
          echo "mypy ratchet OK: $COUNT ≤ $MYPY_MAX_ERRORS"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1 || git fetch origin "${{ github.base_ref }}"
            CHANGED_FILES=$(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" -- 'src/archivist/*.py' 'src/archivist/**/*.py' || true)
            PR_FAIL=0
            for f in $CHANGED_FILES; do
              FILE_ERRORS=$(echo "$REAL_ERRORS" | grep "^${f}:" || true)
              if [ -n "$FILE_ERRORS" ]; then
                echo "::error::mypy error(s) in PR-changed file ${f}:"
                echo "$FILE_ERRORS"
                PR_FAIL=1
              fi
            done
            if [ "$PR_FAIL" -ne 0 ]; then
              echo "::error::PR-changed files under src/archivist/ must have 0 mypy errors (INIT-025/SPEC-012)."
              exit 1
            fi
            echo "mypy PR-changed files OK (0 errors)"
          fi

# ─── Unit + Regression Tests ─────────────────────────────────────────────────
  test:
    name: Unit & Regression Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt
          pip install "coverage[toml]"

      - name: Run unit + regression tests (with coverage collection on 3.12)
        # unit: pure logic — no I/O, no SQLite, no Qdrant — fastest feedback loop
        # regression: specific bug guards — also no external services
        # Combined coverage ≥ 65% and PR diff-cover ≥ 80% are enforced by `coverage-gate`.
        run: |
          if [ "${{ matrix.python-version }}" = "3.12" ]; then
            COVERAGE_FILE=.coverage.unit python -m coverage run --branch -m pytest \
              tests/unit/ tests/regression/ \
              -m "unit or regression" \
              --tb=short \
              --junitxml=test-results-${{ matrix.python-version }}.xml \
              -q
          else
            python -m pytest \
              tests/unit/ tests/regression/ \
              -m "unit or regression" \
              --tb=short \
              --junitxml=test-results-${{ matrix.python-version }}.xml \
              -q
          fi
        env:
          SQLITE_PATH: ":memory:"
          QDRANT_URL: ""

      - name: Upload test results (PR annotations)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: test-results-${{ matrix.python-version }}.xml
          retention-days: 14

      - name: Upload unit coverage data
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-unit
          path: .coverage.unit
          include-hidden-files: true
          retention-days: 7

# ─── Integration + System Tests (SQLite + Live pgvector/pgvector:pg17) ───────
  integration:
    name: Integration & System Tests (SQLite + pgvector:pg17)
    runs-on: ubuntu-24.04
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
        (github.base_ref == 'main' || github.base_ref == 'master'))

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: archivist
          POSTGRES_PASSWORD: archivist_ci_password
          POSTGRES_DB: archivist_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U archivist -d archivist_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt pytest-timeout "coverage[toml]"

      - name: Verify live pgvector/pgvector:pg17 service
        env:
          POSTGRES_TEST_DSN: "postgresql://archivist:archivist_ci_password@127.0.0.1:5432/archivist_test"
        run: |
          python - <<'PY'
          import asyncio, os, asyncpg

          async def verify():
              conn = await asyncpg.connect(os.environ["POSTGRES_TEST_DSN"])
              try:
                  ver = await conn.fetchval("SELECT version()")
                  await conn.execute("CREATE EXTENSION IF NOT EXISTS vector")
                  await conn.execute("CREATE EXTENSION IF NOT EXISTS citext")
                  vec_ver = await conn.fetchval(
                      "SELECT extversion FROM pg_extension WHERE extname = 'vector'"
                  )
                  print(f"Live Postgres OK: {ver} | pgvector {vec_ver}")
                  assert vec_ver, "pgvector extension not available"
              finally:
                  await conn.close()

          asyncio.run(verify())
          PY

      - name: Run integration + system tests (SQLite + live Postgres)
        run: |
          COVERAGE_FILE=.coverage.integration python -m coverage run --branch -m pytest \
            tests/integration/ tests/system/ \
            -m "integration or system" \
            --tb=short \
            --timeout=120 \
            --junitxml=test-results-integration.xml \
            -q
        env:
          SQLITE_PATH: "/tmp/archivist-test.db"
          QDRANT_URL: ""
          POSTGRES_TEST_DSN: "postgresql://archivist:archivist_ci_password@127.0.0.1:5432/archivist_test"
          ARCHIVIST_TEST_DATABASE_URL: "postgresql://archivist:archivist_ci_password@127.0.0.1:5432/archivist_test"

      - name: Verify 0 skipped PostgreSQL integration/storage tests (INIT-025/SPEC-011)
        run: |
          COVERAGE_FILE=.coverage.integration python -m coverage run -a --branch -m pytest \
            tests/integration/storage/test_postgres_backend.py \
            tests/integration/storage/test_dual_backend.py \
            tests/integration/storage/test_checkpoints.py \
            tests/unit/storage/test_provenance_schema.py \
            --tb=short \
            --timeout=120 \
            --junitxml=test-results-postgres.xml \
            -v

          python - <<'PY'
          import xml.etree.ElementTree as ET

          tree = ET.parse("test-results-postgres.xml")
          suites = tree.findall(".//testsuite")
          if not suites and tree.getroot().tag == "testsuite":
              suites = [tree.getroot()]
          total = sum(int(s.attrib.get("tests", 0)) for s in suites)
          skipped = sum(int(s.attrib.get("skipped", 0)) for s in suites)
          failures = sum(int(s.attrib.get("failures", 0)) for s in suites)
          errors = sum(int(s.attrib.get("errors", 0)) for s in suites)
          print(
              f"Postgres suite summary: tests={total} skipped={skipped} "
              f"failures={failures} errors={errors}"
          )
          assert total > 0, "Expected Postgres tests to execute"
          assert skipped == 0, f"SPEC-011 violation: {skipped} Postgres tests were skipped"
          assert failures == 0 and errors == 0, "Postgres suite had failures/errors"
          PY
        env:
          SQLITE_PATH: "/tmp/archivist-pg-verify.db"
          QDRANT_URL: ""
          POSTGRES_TEST_DSN: "postgresql://archivist:archivist_ci_password@127.0.0.1:5432/archivist_test"
          ARCHIVIST_TEST_DATABASE_URL: "postgresql://archivist:archivist_ci_password@127.0.0.1:5432/archivist_test"

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-integration
          path: |
            test-results-integration.xml
            test-results-postgres.xml
          retention-days: 14

      - name: Upload integration coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-integration
          path: .coverage.integration
          include-hidden-files: true
          retention-days: 7

# ─── Combined Coverage Gate (≥ 65% combined + ≥ 80% PR diff-cover) ───────────
  coverage-gate:
    name: Coverage Gate (≥ 65% combined, ≥ 80% PR diff-cover)
    runs-on: ubuntu-24.04
    needs: [test, integration]
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
        (github.base_ref == 'main' || github.base_ref == 'master'))

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install coverage + diff-cover
        run: |
          pip install --upgrade pip
          pip install "coverage[toml]" diff-cover

      - name: Download unit coverage data
        uses: actions/download-artifact@v4
        with:
          name: coverage-data-unit
          path: .

      - name: Download integration coverage data
        uses: actions/download-artifact@v4
        with:
          name: coverage-data-integration
          path: .

      - name: Combine coverage and enforce ≥ 65% floor
        run: |
          coverage combine .coverage.unit .coverage.integration
          coverage xml -o coverage.xml
          coverage report --fail-under=65 --precision=1

      - name: Enforce ≥ 80% diff-cover on PR-changed lines in src/archivist/
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1 || git fetch origin "${{ github.base_ref }}"
          CHANGED_SRC=$(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" -- 'src/archivist/*.py' 'src/archivist/**/*.py' || true)
          if [ -z "$CHANGED_SRC" ]; then
            echo "::notice::No Python files changed under src/archivist/ — skipping diff-cover"
          else
            diff-cover coverage.xml \
              --compare-branch="origin/${{ github.base_ref }}" \
              --include="src/archivist/**" \
              --fail-under=80
          fi

      - name: Upload combined coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

# ─── 3-OS Packaging / CLI Smoke Test (INIT-025/SPEC-011) ─────────────────────
  package-smoke:
    name: Package & CLI Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Run wheel build/install smoke (when PEP 621 present) or src/CLI smoke
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pathlib
          import subprocess
          import sys
          import tempfile
          import tomllib
          import venv

          repo_root = pathlib.Path.cwd()
          pyproject = tomllib.loads((repo_root / "pyproject.toml").read_text(encoding="utf-8"))
          has_build_system = "build-system" in pyproject and "project" in pyproject

          def run(cmd, *, env=None, cwd=None):
              print("+", " ".join(str(c) for c in cmd), flush=True)
              subprocess.run(cmd, check=True, env=env, cwd=cwd)

          if has_build_system:
              print("Detected PEP 621 [build-system]/[project] — running full wheel smoke", flush=True)
              run([sys.executable, "-m", "pip", "install", "--upgrade", "pip", "build"])
              with tempfile.TemporaryDirectory() as tmp:
                  tmp_path = pathlib.Path(tmp)
                  dist_dir = tmp_path / "dist"
                  venv_dir = tmp_path / "venv"
                  run([sys.executable, "-m", "build", "--wheel", "--outdir", str(dist_dir)])
                  wheels = sorted(dist_dir.glob("*.whl"))
                  assert wheels, "No wheel produced by python -m build --wheel"
                  venv.create(venv_dir, with_pip=True)
                  scripts_dir = venv_dir / ("Scripts" if os.name == "nt" else "bin")
                  vpy = scripts_dir / ("python.exe" if os.name == "nt" else "python")
                  run([str(vpy), "-m", "pip", "install", "--upgrade", "pip"])
                  run([str(vpy), "-m", "pip", "install", str(wheels[0])])
                  # Execute outside repo root so imports MUST come from the installed wheel.
                  run(
                      [
                          str(vpy),
                          "-c",
                          (
                              "import pathlib, archivist; "
                              "p = pathlib.Path(archivist.__file__).resolve(); "
                              "print('Wheel archivist:', archivist.__version__, p); "
                              "from archivist.core import config; "
                              "assert config.ArchivistSettings() is not None"
                          ),
                      ],
                      cwd=str(tmp_path),
                  )
                  cli_bin = scripts_dir / ("archivist.exe" if os.name == "nt" else "archivist")
                  if cli_bin.exists():
                      run([str(cli_bin), "--version"], cwd=str(tmp_path))
                  print("Full 3-OS wheel smoke OK", flush=True)
          else:
              print(
                  "Pre-Wave-2 pyproject.toml (no [build-system]/[project]) — "
                  "running cross-OS import + CLI/MCP smoke",
                  flush=True,
              )
              run([sys.executable, "-m", "pip", "install", "--upgrade", "pip"])
              run([sys.executable, "-m", "pip", "install", "-r", "requirements.txt"])
              env = dict(os.environ)
              env["PYTHONPATH"] = str(repo_root / "src")
              run(
                  [
                      sys.executable,
                      "-c",
                      (
                          "import asyncio, platform, archivist; "
                          "from archivist.core.config import ArchivistSettings; "
                          "from archivist.retrieval.context_packer import pack_context; "
                          "from archivist.app.mcp_server import list_tools; "
                          "settings = ArchivistSettings(); "
                          "tools = asyncio.run(list_tools()); "
                          "assert len(tools) > 0, 'Expected registered MCP tools'; "
                          "print(f'Smoke OK on {platform.system()}: archivist {archivist.__version__}, ' "
                          "f'bm25={settings.bm25_enabled}, tools={len(tools)}')"
                      ),
                  ],
                  env=env,
              )
          PY

# ─── Chaos Tests ─────────────────────────────────────────────────────────────
  chaos:
    name: Chaos & Fault-Injection Tests
    runs-on: ubuntu-24.04
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
        (github.base_ref == 'main' || github.base_ref == 'master'))

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt pytest-timeout

      - name: Run chaos tests
        # Fault injection, concurrent writers, write-lock contracts, crash recovery.
        # Isolated job so timing noise from other jobs does not affect these.
        run: |
          python -m pytest \
            tests/chaos/ \
            -m "chaos" \
            --tb=short \
            --timeout=120 \
            --junitxml=test-results-chaos.xml \
            -q
        env:
          SQLITE_PATH: "/tmp/archivist-chaos.db"
          QDRANT_URL: ""

      - name: Upload chaos test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-chaos
          path: test-results-chaos.xml
          retention-days: 14

# ─── Performance Regression Tests ────────────────────────────────────────────
  performance:
    name: Performance Regression Tests (+ >50ms Stall Watchdog)
    runs-on: ubuntu-24.04
    # Run on all pushes to main — never on PRs (timing is noisy on shared runners).
    # If you need to investigate a perf regression on a branch, run locally:
    #   pytest tests/performance/ -m performance --stall-watchdog -v -s
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt pytest-timeout

      - name: Run performance regression tests with >50ms event-loop stall watchdog
        # Timing gates: transaction open/close <50ms, outbox drain 50 events <2000ms,
        # plus asyncio >50ms slow-callback stall watchdog (INIT-025/SPEC-012).
        run: |
          python -m pytest \
            tests/performance/ \
            -m "performance" \
            --stall-watchdog \
            --tb=short \
            --timeout=60 \
            --junitxml=test-results-performance.xml \
            -v -s
        env:
          SQLITE_PATH: "/tmp/archivist-perf.db"
          QDRANT_URL: ""
          ARCHIVIST_STALL_WATCHDOG: "1"

      - name: Upload performance test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-performance
          path: test-results-performance.xml
          retention-days: 30

# ─── Security ────────────────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependency CVE scan (pip-audit)
        # Scans requirements.txt against OSV/PyPI advisory DB.
        # Catches known CVEs before the image is built (complements Trivy).
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt -r requirements-test.txt \
            --output pip-audit-results.json --format json || true
          pip-audit -r requirements.txt -r requirements-test.txt

      - name: Install Bandit
        run: pip install bandit[toml]

      - name: Bandit SAST scan
        run: |
          bandit -r src/ -ll -c pyproject.toml \
            -f json -o bandit-results.json || true
          bandit -r src/ -ll -c pyproject.toml

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif

# ─── Docker Build + Smoke Test ───────────────────────────────────────────────
  docker:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io (push steps only)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (linux/amd64 only for CI speed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: archivist:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — package imports
        run: |
          docker run --rm archivist:ci-${{ github.sha }} \
            python -c "
          import sys
          sys.path.insert(0, '/app')
          import archivist
          print(f'archivist {archivist.__version__} OK')
          from archivist.core import config
          from archivist.storage import qdrant
          from archivist.lifecycle import cascade
          print('core imports OK')
          "

      - name: Smoke test — live /health, /metrics, and /mcp (blocking, no error masking)
        run: |
          set -euo pipefail

          NET_NAME="archivist-smoke-net"
          cleanup() {
            rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "=== archivist-smoke logs (failure) ==="
              docker logs archivist-smoke 2>&1 | tail -n 80 || true
              echo "=== archivist-smoke-qdrant logs (failure) ==="
              docker logs archivist-smoke-qdrant 2>&1 | tail -n 40 || true
            fi
            docker rm -f archivist-smoke archivist-smoke-qdrant >/dev/null 2>&1 || true
            docker network rm "$NET_NAME" >/dev/null 2>&1 || true
            exit "$rc"
          }
          trap cleanup EXIT

          docker network create "$NET_NAME"
          docker run -d --name archivist-smoke-qdrant \
            --network "$NET_NAME" \
            -p 16333:6333 \
            qdrant/qdrant:v1.13.4

          echo "Waiting for Qdrant..."
          curl -sf --retry 20 --retry-delay 1 --retry-connrefused http://127.0.0.1:16333/collections >/dev/null

          docker run -d --name archivist-smoke \
            --network "$NET_NAME" \
            -p 3100:3100 \
            -e QDRANT_URL=http://archivist-smoke-qdrant:6333 \
            -e LLM_URL=http://127.0.0.1:11434 \
            -e EMBED_URL=http://127.0.0.1:8000 \
            -e LLM_MODEL=test \
            -e EMBED_MODEL=test \
            -e METRICS_ENABLED=true \
            archivist:ci-${{ github.sha }}

          echo "Waiting for Archivist /health..."
          HEALTH_BODY=$(curl -sf --retry 20 --retry-delay 2 --retry-connrefused http://127.0.0.1:3100/health)
          echo "Health response: $HEALTH_BODY"

          METRICS_BODY=$(curl -sf http://127.0.0.1:3100/metrics)
          MCP_BODY=$(curl -sf \
            -X POST http://127.0.0.1:3100/mcp \
            -H "Accept: application/json, text/event-stream" \
            -H "Content-Type: application/json" \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci-docker-smoke","version":"1.0"}}}')
          echo "MCP initialize response: $MCP_BODY"

          HEALTH_BODY="$HEALTH_BODY" METRICS_BODY="$METRICS_BODY" MCP_BODY="$MCP_BODY" python3 - <<'PY'
          import json, os, re

          health = json.loads(os.environ["HEALTH_BODY"])
          assert health.get("status") == "healthy", f"Unexpected /health status: {health}"
          assert health.get("service") == "archivist", f"Unexpected /health service: {health}"

          metrics_text = os.environ["METRICS_BODY"]
          assert "# TYPE" in metrics_text, "Missing Prometheus # TYPE metadata in /metrics"
          inf_re = re.compile(
              r'^(?P<name>[a-zA-Z0-9_:]+)_bucket\{(?P<labels>[^}]*le="\+Inf"[^}]*)\}\s+(?P<val>[0-9.eE+-]+)$'
          )
          cnt_re = re.compile(
              r"^(?P<name>[a-zA-Z0-9_:]+)_count(?:\{(?P<labels>[^}]*)\})?\s+(?P<val>[0-9.eE+-]+)$"
          )

          def strip_le(lbl: str) -> str:
              return ",".join(sorted(p.strip() for p in lbl.split(",") if p.strip() and not p.strip().startswith("le=")))

          infs, cnts = {}, {}
          for line in metrics_text.splitlines():
              s = line.strip()
              if not s or s.startswith("#"):
                  continue
              m = inf_re.match(s)
              if m:
                  infs[(m.group("name"), strip_le(m.group("labels")))] = float(m.group("val"))
              else:
                  m = cnt_re.match(s)
                  if m:
                      cnts[(m.group("name"), strip_le(m.group("labels") or ""))] = float(m.group("val"))
          for k, v in infs.items():
              assert k in cnts, f"Missing _count for histogram {k}"
              assert abs(v - cnts[k]) < 1e-9, f"Histogram invariant mismatch for {k}: +Inf={v} != _count={cnts[k]}"

          mcp_text = os.environ["MCP_BODY"]
          assert "serverInfo" in mcp_text and "archivist" in mcp_text, f"Unexpected MCP initialize body: {mcp_text}"
          print("Docker /health, /metrics, and /mcp smoke assertions PASSED")
          PY

      - name: Derive lowercase image name
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: echo "IMAGE_REPO=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Push edge image to ghcr.io
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:edge
            ${{ env.IMAGE_REPO }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
